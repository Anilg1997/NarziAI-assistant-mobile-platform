// ============================================================================
// NarzoAI Native Library Download Tasks
// Downloads pre-built .so files from GitHub Releases as fallback when
// CMake/NDK build fails or when the user opts out of native builds.
// ============================================================================

/**
 * Configuration for native library fallback download.
 * Change these URLs to point to your own GitHub release.
 */
ext {
    // Whether to use pre-built binaries instead of CMake builds
    // Can also be enabled via: ./gradlew assembleDebug -PusePrebuiltNative
    narzoaiUsePrebuiltNative = false

    // GitHub repository for pre-built native libraries
    narzoaiNativeRepo = "Anilg1997/NarziAI-assistant-mobile-platform"

    // Default fallback version (use "latest" for the latest release)
    narzoaiNativeVersion = "latest"
}

// Conditionally include or exclude the CMake external native build
// by setting the cmake path only when NOT using pre-built libraries.
def usePrebuilt = project.hasProperty("usePrebuiltNative") || ext.narzoaiUsePrebuiltNative

if (usePrebuilt) {
    logger.warn("NarzoAI: Using pre-built native libraries (CMake/NDK build disabled)")
    logger.warn("Make sure pre-built .so files are in app/src/main/jniLibs/")
    logger.warn("Run './gradlew downloadNarzoaiNativeLibs' to download them.")
} else {
    // CMake external native build is active
    logger.lifecycle("NarzoAI: CMake native build enabled (use -PusePrebuiltNative to use pre-built binaries)")
}

/**
 * Task: downloadNarzoaiNativeLibs
 *
 * Downloads pre-built libnarzoai_jni.so files from GitHub Releases
 * and extracts them into the jniLibs directory.
 *
 * Usage:
 *   ./gradlew downloadNarzoaiNativeLibs              # Download latest version
 *   ./gradlew downloadNarzoaiNativeLibs -PVERSION=v1.0.0  # Specific version
 */
tasks.register("downloadNarzoaiNativeLibs") {
    description = "Downloads pre-built native .so libraries from GitHub Releases"
    group = "NarzoAI"

    doLast {
        def version = project.findProperty("VERSION") ?: ext.narzoaiNativeVersion
        def repo = ext.narzoaiNativeRepo

        // Resolve the download URL (always uses .zip format)
        def downloadUrl
        if (version == "latest") {
            downloadUrl = "https://github.com/${repo}/releases/latest/download/narzoai-native-latest.zip"
        } else {
            downloadUrl = "https://github.com/${repo}/releases/download/${version}/narzoai-native-${version}.zip"
        }

        def jniLibsDir = file("src/main/jniLibs")
        def downloadDir = file("${buildDir}/narzoai-native-download")
        def zipFile = file("${downloadDir}/narzoai-native.zip")

        logger.lifecycle("============================================")
        logger.lifecycle("NarzoAI Native Library Download")
        logger.lifecycle("============================================")
        logger.lifecycle("Version: ${version}")
        logger.lifecycle("Download URL: ${downloadUrl}")
        logger.lifecycle("Extract to: ${jniLibsDir}")

        // Step 1: Create download directory
        downloadDir.mkdirs()

        // Step 2: Download the zip file
        logger.lifecycle("Downloading pre-built native libraries...")
        try {
            def url = new URL(downloadUrl)
            def connection = url.openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 120000
            connection.setRequestProperty("User-Agent", "NarzoAI-Gradle")
            zipFile.parentFile.mkdirs()
            zipFile.bytes = connection.bytes
        } catch (Exception e) {
            throw new GradleException(
                "Failed to download native libraries from ${downloadUrl}.\n" +
                "Reason: ${e.message}\n\n" +
                "Make sure the release exists or build manually:\n" +
                "  1. Install Android NDK\n" +
                "  2. Run: ./gradlew assembleDebug\n" +
                "  3. Or trigger the GitHub Actions workflow: .github/workflows/build-native.yml"
            )
        }

        if (!zipFile.exists()) {
            throw new GradleException(
                "Download completed but file not found: ${zipFile.absolutePath}"
            )
        }

        logger.lifecycle("Downloaded: ${String.format("%.0f", zipFile.length() / 1024.0)} KB")

        // Step 3: Extract the zip archive
        logger.lifecycle("Extracting native libraries...")
        copy {
            from zipTree(zipFile)
            into downloadDir
        }

        // Step 4: Find the extraction root (might be nested under one directory)
        def extractedDirs = downloadDir.listFiles()?.findAll { it.isDirectory() } ?: []
        def extractedRoot = downloadDir
        if (extractedDirs.size() == 1) {
            extractedRoot = extractedDirs[0]
            logger.lifecycle("Found nested extraction directory: ${extractedRoot.name}")
        }

        // Step 5: Copy .so files to correct jniLibs directories
        logger.lifecycle("Copying .so files to jniLibs...")

        def abis = ["arm64-v8a", "armeabi-v7a"]
        int copiedCount = 0

        abis.each { abi ->
            def sourceFile = new File(extractedRoot, "${abi}/libnarzoai_jni.so")
            def targetDir = new File(jniLibsDir, abi)

            if (sourceFile.exists()) {
                targetDir.mkdirs()

                // Remove any existing .so file (keep .gitkeep intact)
                def existingFiles = targetDir.listFiles()?.findAll {
                    it.name.endsWith(".so")
                } ?: []
                existingFiles.each { it.delete() }

                // Copy the new .so file
                copy {
                    from sourceFile
                    into targetDir
                }

                // Make executable on Unix systems
                def copiedFile = new File(targetDir, "libnarzoai_jni.so")
                if (copiedFile.exists()) {
                    copiedFile.setExecutable(true, false)
                    def sizeKB = String.format("%.0f", copiedFile.length() / 1024.0)
                    logger.lifecycle("  ${abi}: libnarzoai_jni.so (${sizeKB} KB) ✅")
                    copiedCount++
                }
            } else {
                logger.warn("  ${abi}: NOT FOUND (expected: ${sourceFile.absolutePath})")
            }
        }

        // Step 6: Clean up download directory
        delete downloadDir

        if (copiedCount == 0) {
            throw new GradleException(
                "No .so files were extracted. The archive may be corrupted or incompatible.\n" +
                "Try building native libraries locally with: ./gradlew assembleDebug"
            )
        }

        logger.lifecycle("")
        logger.lifecycle("✅ Native libraries installed successfully (${copiedCount}/${abis.size()} ABIs)")
        logger.lifecycle("You can now build the app with: ./gradlew assembleDebug -PusePrebuiltNative")
        logger.lifecycle("")
    }
}

/**
 * Task: checkNarzoaiNativeLibs
 * Checks if native .so files exist in jniLibs for the configured ABIs.
 */
tasks.register("checkNarzoaiNativeLibs") {
    description = "Checks if pre-built native libraries are already installed"
    group = "NarzoAI"

    doLast {
        def jniLibsDir = file("src/main/jniLibs")
        def abis = ["arm64-v8a", "armeabi-v7a"]
        boolean allFound = true

        logger.lifecycle("Checking pre-built native libraries in jniLibs...")

        abis.each { abi ->
            def soFile = new File(jniLibsDir, "${abi}/libnarzoai_jni.so")
            if (soFile.exists()) {
                def sizeKB = String.format("%.0f", soFile.length() / 1024.0)
                logger.lifecycle("  ✅ ${abi}: libnarzoai_jni.so (${sizeKB} KB)")
            } else {
                logger.lifecycle("  ❌ ${abi}: NOT FOUND")
                allFound = false
            }
        }

        if (allFound) {
            logger.lifecycle("All native libraries present. Run './gradlew assembleDebug -PusePrebuiltNative' to build.")
        } else {
            logger.lifecycle("Some native libraries are missing.")
            logger.lifecycle("Run './gradlew downloadNarzoaiNativeLibs' to download them.")
        }
    }
}

/**
 * Task: rebuildNarzoaiNative
 * Cleans and re-downloads the native libraries.
 */
tasks.register("rebuildNarzoaiNative") {
    description = "Cleans and re-downloads pre-built native libraries from GitHub Releases"
    group = "NarzoAI"

    dependsOn tasks.named("downloadNarzoaiNativeLibs")

    doFirst {
        logger.lifecycle("Cleaning existing native libraries before re-download...")

        def jniLibsDir = file("src/main/jniLibs")
        def abis = ["arm64-v8a", "armeabi-v7a"]

        abis.each { abi ->
            def soFile = new File(jniLibsDir, "${abi}/libnarzoai_jni.so")
            if (soFile.exists()) {
                soFile.delete()
                logger.lifecycle("  Deleted: ${soFile.absolutePath}")
            }
        }
    }
}

