    compileSdk = 34

    defaultConfig {
        applicationId = "com.narzoai.assistant"
        minSdk = 29  // Android 10
        targetSdk = 34  // Android 14
        versionCode = 1
        versionName = "1.0.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // NDK configuration for llama.cpp and whisper.cpp
        ndk {
            abiFilters += ["arm64-v8a", "armeabi-v7a"]
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
        debug {
            minifyEnabled false
            applicationIdSuffix = ".debug"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = true
    }

    // External Native Build for llama.cpp and whisper.cpp via CMake
    // Only active when NOT using pre-built binaries (-PusePrebuiltNative)
    if (!usePrebuilt) {
        externalNativeBuild {
            cmake {
                path = file("src/main/cpp/CMakeLists.txt")
                version = "3.22.1"
            }
        }
    }

    // NDK configuration for llama.cpp and whisper.cpp
    ndkVersion = "26.1.10909125"

    // Allow large model files in assets
    aaptOptions {
        noCompress("gguf", "bin", "model")
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/NOTICE.md"
            excludes += "/META-INF/LICENSE.md"
        }
    }
}

