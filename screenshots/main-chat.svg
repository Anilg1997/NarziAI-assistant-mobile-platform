<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" font-family="'Roboto','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="toolbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e"/><stop offset="100%" stop-color="#3949ab"/>
    </linearGradient>
    <linearGradient id="userBubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3949ab"/><stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
  </defs>

  <!-- Phone body -->
  <rect x="40" y="10" rx="24" ry="24" width="520" height="730" fill="white" stroke="#ddd" stroke-width="2"/>
  <!-- Status bar -->
  <rect x="40" y="10" rx="24" ry="24" width="520" height="40" fill="#1a237e"/>
  <text x="64" y="32" font-size="11" fill="white">9:41</text>
  <text x="480" y="32" font-size="11" fill="white">📶 🔋 87%</text>
  <!-- Notch -->
  <rect x="250" y="18" rx="10" ry="10" width="60" height="16" fill="black"/>

  <!-- Toolbar -->
  <rect x="40" y="50" width="520" height="56" fill="url(#toolbar)"/>
  <text x="64" y="84" font-size="14" fill="white" font-weight="500">🧠 NarzoAI</text>
  <text x="470" y="84" font-size="14" fill="white">⚙️</text>

  <!-- Chat Messages -->
  <!-- AI Welcome -->
  <rect x="68" y="122" rx="18" ry="18" width="280" height="50" fill="#f0f2f5"/>
  <text x="82" y="144" font-size="13" fill="#333">👋 Hello! I'm NarzoAI, your offline</text>
  <text x="82" y="162" font-size="13" fill="#333">AI assistant. How can I help?</text>

  <!-- User -->
  <rect x="230" y="190" rx="18" ry="18" width="310" height="50" fill="url(#userBubble)"/>
  <text x="246" y="212" font-size="13" fill="white">Hey Narzo! What's the weather like</text>
  <text x="246" y="230" font-size="13" fill="white">in Hyderabad today?</text>

  <!-- AI Response -->
  <rect x="68" y="258" rx="18" ry="18" width="380" height="100" fill="#f0f2f5"/>
  <text x="82" y="280" font-size="13" fill="#333">🌤 I can check that for you! (Note: This</text>
  <text x="82" y="298" font-size="13" fill="#333">requires internet or the Weather app)</text>
  <text x="82" y="320" font-size="13" fill="#333">Opening Weather app to check...</text>
  <text x="82" y="344" font-size="12" fill="#666">Swipe to see weather data →</text>

  <!-- User -->
  <rect x="260" y="376" rx="18" ry="18" width="280" height="50" fill="url(#userBubble)"/>
  <text x="276" y="398" font-size="13" fill="white">Set an alarm for 7:30 AM tomorrow</text>
  <text x="276" y="416" font-size="13" fill="white">for my morning jog 🏃</text>

  <!-- AI Response -->
  <rect x="68" y="444" rx="18" ry="18" width="320" height="50" fill="#f0f2f5"/>
  <text x="82" y="466" font-size="13" fill="#333">✅ Alarm set for 7:30 AM tomorrow!</text>
  <text x="82" y="484" font-size="13" fill="#333">Label: "Morning Jog"</text>

  <!-- User -->
  <rect x="300" y="512" rx="18" ry="18" width="240" height="34" fill="url(#userBubble)"/>
  <text x="316" y="534" font-size="13" fill="white">Open WhatsApp please</text>

  <!-- Voice input area -->
  <rect x="56" y="648" width="488" height="70" fill="#f8f9fa"/>
  <line x1="56" y1="648" x2="544" y2="648" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="68" y="662" rx="20" ry="20" width="370" height="40" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="84" y="688" font-size="13" fill="#999">Type a message...</text>
  <!-- Mic button -->
  <circle cx="470" cy="682" r="24" fill="url(#toolbar)"/>
  <text x="470" y="690" font-size="22" fill="white" text-anchor="middle">🎤</text>
  <!-- Send button -->
  <circle cx="520" cy="682" r="20" fill="#e0e0e0"/>
  <polygon points="514,682 524,676 524,688" fill="#999"/>

  <!-- Home indicator -->
  <rect x="220" y="726" rx="4" ry="4" width="160" height="4" fill="#ddd"/>
</svg>