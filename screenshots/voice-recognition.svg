<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" font-family="'Roboto','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="toolbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e"/><stop offset="100%" stop-color="#3949ab"/>
    </linearGradient>
  </defs>

  <!-- Phone body -->
  <rect x="40" y="10" rx="24" ry="24" width="520" height="730" fill="white" stroke="#ddd" stroke-width="2"/>
  <rect x="40" y="10" rx="24" ry="24" width="520" height="40" fill="#1a237e"/>
  <text x="64" y="32" font-size="11" fill="white">9:41</text>
  <text x="480" y="32" font-size="11" fill="white">📶 🔋 79%</text>
  <rect x="250" y="18" rx="10" ry="10" width="60" height="16" fill="black"/>

  <!-- Toolbar -->
  <rect x="40" y="50" width="520" height="56" fill="url(#toolbar)"/>
  <text x="64" y="84" font-size="14" fill="white" font-weight="500">🎤 Voice Mode</text>

  <!-- Listening indicator -->
  <circle cx="300" cy="200" r="80" fill="none" stroke="#e8eaf6" stroke-width="2"/>
  <circle cx="300" cy="200" r="60" fill="none" stroke="#c5cae9" stroke-width="2"/>
  <circle cx="300" cy="200" r="40" fill="none" stroke="#3949ab" stroke-width="2"/>
  <circle cx="300" cy="200" r="20" fill="#3949ab" opacity="0.8"/>

  <!-- Animated voice visualization bars -->
  <rect x="250" y="300" width="6" height="40" rx="3" fill="#3949ab">
    <animate attributeName="height" values="40;60;30;70;40" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="262" y="280" width="6" height="60" rx="3" fill="#5c6bc0">
    <animate attributeName="height" values="60;40;70;30;60" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <rect x="274" y="270" width="6" height="70" rx="3" fill="#7986cb">
    <animate attributeName="height" values="70;50;40;80;70" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="286" y="260" width="6" height="80" rx="3" fill="#9fa8da">
    <animate attributeName="height" values="80;60;50;90;80" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="298" y="250" width="6" height="90" rx="3" fill="#5c6bc0">
    <animate attributeName="height" values="90;70;60;100;90" dur="0.9s" repeatCount="indefinite"/>
  </rect>
  <rect x="310" y="260" width="6" height="80" rx="3" fill="#7986cb">
    <animate attributeName="height" values="80;60;50;90;80" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="322" y="270" width="6" height="70" rx="3" fill="#9fa8da">
    <animate attributeName="height" values="70;50;40;80;70" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <rect x="334" y="280" width="6" height="60" rx="3" fill="#5c6bc0">
    <animate attributeName="height" values="60;40;70;30;60" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="346" y="300" width="6" height="40" rx="3" fill="#3949ab">
    <animate attributeName="height" values="40;60;30;70;40" dur="0.7s" repeatCount="indefinite"/>
  </rect>

  <!-- Status text -->
  <text x="300" y="400" font-size="16" fill="#1a237e" font-weight="600" text-anchor="middle">🎧 Listening...</text>
  <text x="300" y="424" font-size="13" fill="#666" text-anchor="middle">Speak clearly or say "Hey Narzo"</text>

  <!-- Transcription area -->
  <rect x="80" y="456" rx="12" ry="12" width="440" height="60" fill="#f5f5f5"/>
  <text x="100" y="480" font-size="14" fill="#333">"Set alarm for 7:30 AM tomorrow..."</text>
  <text x="100" y="500" font-size="12" fill="#666">Confidence: 96% • Whisper Tiny</text>

  <!-- Action buttons -->
  <rect x="80" y="540" rx="6" ry="6" width="200" height="40" fill="#4caf50"/>
  <text x="180" y="566" font-size="13" fill="white" text-anchor="middle">✓ Confirm & Execute</text>
  <rect x="300" y="540" rx="6" ry="6" width="100" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="350" y="566" font-size="13" fill="#666" text-anchor="middle">✕ Cancel</text>
  <rect x="420" y="540" rx="6" ry="6" width="100" height="40" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="470" y="566" font-size="13" fill="#666" text-anchor="middle">✎ Edit</text>

  <!-- Wake word indicator -->
  <rect x="80" y="596" rx="8" ry="8" width="440" height="40" fill="#fff8e1" stroke="#ffe082" stroke-width="1"/>
  <text x="100" y="622" font-size="12" fill="#f57c00">💡 Wake word "Hey Narzo" is active — say it anytime to activate</text>

  <!-- Recent voice commands -->
  <text x="80" y="658" font-size="12" fill="#666" font-weight="500">Recent Voice Commands</text>
  <text x="80" y="680" font-size="13" fill="#333">📱 "Open WhatsApp"</text>
  <text x="80" y="700" font-size="13" fill="#333">☀️ "What's the battery level?"</text>

  <rect x="220" y="726" rx="4" ry="4" width="160" height="4" fill="#ddd"/>
</svg>