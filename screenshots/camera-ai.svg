<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" font-family="'Roboto','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="toolbar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a237e"/><stop offset="100%" stop-color="#3949ab"/>
    </linearGradient>
  </defs>

  <!-- Phone body -->
  <rect x="40" y="10" rx="24" ry="24" width="520" height="730" fill="black" stroke="#333" stroke-width="2"/>
  <rect x="40" y="10" rx="24" ry="24" width="520" height="40" fill="black"/>
  <text x="64" y="32" font-size="11" fill="white">9:41</text>
  <text x="480" y="32" font-size="11" fill="white">📶 🔋 82%</text>
  <rect x="250" y="18" rx="10" ry="10" width="60" height="16" fill="#333"/>

  <!-- Camera View -->
  <rect x="40" y="50" width="520" height="530" fill="#1a1a2e"/>
  <rect x="40" y="50" width="520" height="56" fill="rgba(0,0,0,0.5)"/>
  <text x="64" y="84" font-size="14" fill="white" font-weight="500">📷 Camera AI</text>
  <text x="470" y="84" font-size="12" fill="white">Object Detection</text>

  <!-- Camera scene - a desk with objects -->
  <!-- Table surface -->
  <rect x="40" y="400" width="520" height="180" fill="#2d2d2d"/>
  <line x1="40" y1="400" x2="560" y2="400" stroke="#444" stroke-width="1"/>

  <!-- Objects on desk -->
  <!-- Bottle -->
  <rect x="200" y="290" rx="4" ry="4" width="40" height="110" fill="#2196f3" opacity="0.8"/>
  <rect x="195" y="280" rx="2" ry="2" width="50" height="12" fill="#1976d2" opacity="0.8"/>
  <!-- Laptop -->
  <rect x="320" y="330" rx="4" ry="4" width="120" height="8" fill="#555"/>
  <rect x="330" y="270" rx="4" ry="4" width="100" height="60" fill="#444" opacity="0.6"/>
  <!-- Book -->
  <rect x="140" y="350" rx="2" ry="2" width="60" height="50" fill="#e57373" opacity="0.7"/>
  <!-- Phone -->
  <rect x="420" y="340" rx="4" ry="4" width="25" height="50" fill="#66bb6a" opacity="0.8"/>

  <!-- Bounding boxes -->
  <rect x="196" y="276" width="54" height="130" rx="4" ry="4" fill="none" stroke="#2196f3" stroke-width="2"/>
  <text x="200" y="272" font-size="10" fill="#2196f3" font-weight="600">BOTTLE (98%)</text>
  <rect x="326" y="266" width="108" height="68" rx="4" ry="4" fill="none" stroke="#4caf50" stroke-width="2"/>
  <text x="330" y="262" font-size="10" fill="#4caf50" font-weight="600">LAPTOP (95%)</text>
  <rect x="136" y="346" width="68" height="58" rx="4" ry="4" fill="none" stroke="#f44336" stroke-width="2"/>
  <text x="140" y="342" font-size="10" fill="#f44336" font-weight="600">BOOK (89%)</text>
  <rect x="416" y="336" width="34" height="58" rx="4" ry="4" fill="none" stroke="#ff9800" stroke-width="2"/>
  <text x="420" y="332" font-size="10" fill="#ff9800" font-weight="600">PHONE (92%)</text>

  <!-- Grid lines -->
  <line x1="40" y1="180" x2="560" y2="180" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="280" x2="560" y2="280" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="180" y1="50" x2="180" y2="580" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="360" y1="50" x2="360" y2="580" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Bottom bar -->
  <rect x="40" y="580" width="520" height="80" fill="rgba(0,0,0,0.8)"/>
  <!-- Toggle buttons -->
  <rect x="80" y="596" rx="16" ry="16" width="130" height="40" fill="#3949ab"/>
  <text x="145" y="622" font-size="12" fill="white" text-anchor="middle">🔍 Object Detection</text>
  <rect x="220" y="596" rx="16" ry="16" width="100" height="40" fill="rgba(255,255,255,0.2)"/>
  <text x="270" y="622" font-size="12" fill="white" text-anchor="middle">📝 OCR</text>
  <rect x="340" y="596" rx="16" ry="16" width="80" height="40" fill="rgba(255,255,255,0.2)"/>
  <text x="380" y="622" font-size="12" fill="white" text-anchor="middle">📷 QR</text>

  <!-- Shutter button -->
  <circle cx="300" cy="700" r="28" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="3"/>
  <circle cx="300" cy="700" r="22" fill="white"/>
  <circle cx="300" cy="700" r="18" fill="#f5f5f5"/>

  <!-- Gallery preview -->
  <rect x="88" y="680" rx="6" ry="6" width="40" height="40" fill="#333" stroke="#444" stroke-width="1"/>
  <rect x="88" y="680" rx="6" ry="6" width="40" height="30" fill="#2196f3" opacity="0.5"/>

  <!-- Flash toggle -->
  <text x="470" y="706" font-size="16" fill="white">⚡</text>

  <rect x="220" y="726" rx="4" ry="4" width="160" height="4" fill="#444"/>
</svg>